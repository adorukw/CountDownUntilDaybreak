name: Build Windows

# 触发条件：
#   - push 到 main：编译 + 上传 artifact
#   - push tag v*：编译 + 上传 artifact + 创建 Release 并附带 zip
#   - workflow_dispatch：手动触发
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # pacboy 的 pkg:p 简写等价于 mingw-w64-ucrt-x86_64-<pkg>
          pacboy: >-
            gcc:p
            cmake:p
            SDL2:p
            SDL2_image:p
            SDL2_mixer:p
            SDL2_ttf:p

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: C:\msys64\var\cache\pacman\pkg
          key: msys2-ucrt64-${{ hashFiles('.github/workflows/build-windows.yml') }}
          restore-keys: |
            msys2-ucrt64-

      - name: CMake Configure
        run: |
          cmake -B build -G "MinGW Makefiles" \
                -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Stage artifacts (exe + assets + DLLs)
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p build/stage

          # 1. 复制可执行文件
          cp build/CDUD.exe build/stage/

          # 2. 复制 assets（POST_BUILD 已复制到 build/assets，这里再搬到 stage）
          cp -r build/assets build/stage/assets

          # 3. 用 ldd 自动解析 CDUD.exe 的运行时依赖，
          #    仅保留位于 ucrt64/bin 下的 DLL（即 SDL2 系列及其传递依赖）
          ldd build/CDUD.exe \
            | grep -i 'ucrt64' \
            | awk '{print $3}' \
            | while read dll; do
                [ -f "$dll" ] && cp -n "$dll" build/stage/
              done

          echo "=== Staged files ==="
          ls -la build/stage/

      - name: Package zip
        shell: pwsh
        run: |
          $zip = "CDUD-windows-x64.zip"
          Compress-Archive -Path build/stage/* -DestinationPath $zip -Force
          Write-Host "Created $zip"
          Get-Item $zip | Format-List Name, Length, FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDUD-windows-x64
          path: CDUD-windows-x64.zip
          retention-days: 14
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CDUD-windows-x64.zip
          generate_release_notes: true
